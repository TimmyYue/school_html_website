<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Minecraft史-關於麥塊</title>
    <meta name="subject" content="關於麥塊 - TimmyYue">
    <meta name="abstract" content="關於麥塊 - TimmyYue">
    <meta name="url" content="https://www.timmysrv.tk/about">
    <meta name="description" content="了解Minecraft的簡單內容吧">
    <script src="https://kit.fontawesome.com/ea15332052.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <style>
        .banner {
            width: auto;
            height: 70px;
            background-color: rgb(117, 147, 245);
        }

        .link {
            text-align: center;
            position: relative;
            letter-spacing: 10px;
            font-size: 150%;
            top: 50%;
            transform: translate(0%, -50%);
        }

        .link a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .link a:hover {
            color: black;
            transition: all 1s 0s ease;
        }

        .icon {
            position: relative;
            top: 10px;
            left: 5px;
            float: left;
        }

        .row0 {
            display: flex;
            position: absolute;
            z-index: 1;
        }

        .container0 {
            width: auto;
            height: 60%;
            background-color: rgb(225, 247, 165);
            position: relative;
            display: flex;
        }

        .ad {
            width: 70px;
            height: 70px;
            position: fixed;
            top: 80%;
            right: 3%;
            opacity: 20%;
        }

        .ad img {
            width: 70px;
            height: 70px;
            margin: 2px 2px;
        }

        .line{
            width: auto;
            height: 50px;
            background-color: rgb(117, 147, 245);
            text-align: center;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: white;
            font-size: 19px;
        }
        .container0 img{
            width: 100%;
            height: 60%;
        }
        .item0{
            font-size: 19px;
            font-weight: bold;
            width: auto;
            height: 50px;
            color: white;
            display: flex;
            position: absolute;
            text-align: center;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="ad">
        <img src="images/minecraft-icon.webp" alt="">
    </div>
    <div class="banner" id="#home">
        <a href="#home" class="icon">
            <img src="images/icon.ico" width="50" height="50">
        </a>
        <div class="link">
            <a href="index.html">首頁</a>
            <a href="about.html">關於麥塊</a>
            <a href="#">遊戲特色</a>
            <a href="#">自然建築</a>
        </div>
    </div>
    <div class="container0" id="#home">
        <div class="row0">
            <div class="item0">關於麥塊</div>
            <img src="images/home_back3.webp">
        </div>
    </div>
</body>
</html>
